<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Image</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <header>
        <h1>Edit Image</h1>
        <a href="{{ url_for('index') }}" class="btn btn-back">Back to List</a>
    </header>

    <div class="form-card">
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Title <span class="required">*</span></label>
                <input type="text" id="title" name="title" required value="{{ image['title'] }}">
            </div>

            <div class="form-group">
                <label>Current Image</label>
                {% if image['filename'] %}
                <div class="current-image">
                    <img src="{{ url_for('static', filename='uploads/' ~ image['filename']) }}" alt="{{ image['title'] }}">
                    <span class="filename">{{ image['filename'] }}</span>
                </div>
                {% else %}
                <p class="no-current">No image currently uploaded.</p>
                {% endif %}
            </div>

            <div class="form-group">
                <label for="image_file">Replace Image File</label>
                <input type="file" id="image_file" name="image_file" accept=".png,.jpg,.jpeg,.gif,.webp,.bmp">
                <small class="hint">Leave blank to keep the current image. Accepted: PNG, JPG, JPEG, GIF, WEBP, BMP</small>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" value="{{ image['category'] or '' }}" placeholder="e.g. Nature, Travel, Art">
            </div>

            <div class="form-group">
                <label for="tags">Tags</label>
                <input type="text" id="tags" name="tags" value="{{ image['tags'] or '' }}" placeholder="e.g. sunset, landscape, portrait">
                <small class="hint">Separate tags with commas</small>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4">{{ image['description'] or '' }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Image</button>
                <a href="{{ url_for('index') }}" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
