<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Image</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <header>
        <h1>Add Image</h1>
        <a href="{{ url_for('index') }}" class="btn btn-back">Back to List</a>
    </header>

    <div class="form-card">
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Title <span class="required">*</span></label>
                <input type="text" id="title" name="title" required placeholder="Enter image title">
            </div>

            <div class="form-group">
                <label for="image_file">Image File</label>
                <input type="file" id="image_file" name="image_file" accept=".png,.jpg,.jpeg,.gif,.webp,.bmp">
                <small class="hint">Accepted: PNG, JPG, JPEG, GIF, WEBP, BMP (max 16MB)</small>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" placeholder="e.g. Nature, Travel, Art">
            </div>

            <div class="form-group">
                <label for="tags">Tags</label>
                <input type="text" id="tags" name="tags" placeholder="e.g. sunset, landscape, portrait">
                <small class="hint">Separate tags with commas</small>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" placeholder="Optional description..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Image</button>
                <a href="{{ url_for('index') }}" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
