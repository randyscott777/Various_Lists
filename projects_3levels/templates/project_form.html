<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="header">
    <h1>Projects App</h1>
    <span class="breadcrumb">
        <a href="{{ url_for('index') }}">Dashboard</a>
        <span>&rsaquo;</span> {{ title }}
    </span>
</div>
<div class="container">
    <div class="form-card">
        <h2>{{ title }}</h2>
        <form method="POST">
            <div class="form-group">
                <label>Project Name *</label>
                <input type="text" name="name" value="{{ project['name'] if project else '' }}" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description">{{ project['description'] if project else '' }}</textarea>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select name="status">
                    {% for s in status_options %}
                    <option value="{{ s }}" {% if project and project['status'] == s %}selected{% elif not project and s == 'Not Started' %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select name="priority">
                    {% for p in priority_options %}
                    <option value="{{ p }}" {% if project and project['priority'] == p %}selected{% elif not project and p == 'Medium' %}selected{% endif %}>{{ p }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" name="due_date" value="{{ project['due_date'] if project and project['due_date'] else '' }}">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-success">Save Project</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
