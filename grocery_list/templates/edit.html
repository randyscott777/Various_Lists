{% extends "base.html" %}
{% block title %}Edit Item — Grocery List{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <h2 class="form-title">Edit Item</h2>
        <form method="post" action="{{ url_for('edit', item_id=item.id) }}" class="item-form">

            <div class="form-group">
                <label for="name">Item Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" required autofocus
                       value="{{ item.name }}" class="form-input">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity"
                           value="{{ item.quantity }}" min="0.01" step="0.01" class="form-input">
                </div>
                <div class="form-group">
                    <label for="unit">Unit</label>
                    <select id="unit" name="unit" class="form-input">
                        {% for u in units %}
                        <option value="{{ u }}" {% if item.unit == u %}selected{% endif %}>
                            {{ u if u else '— none —' }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" class="form-input">
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if item.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <input type="text" id="notes" name="notes"
                       value="{{ item.notes }}" class="form-input">
            </div>

            <div class="form-actions">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
