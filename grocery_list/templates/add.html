{% extends "base.html" %}
{% block title %}Add Item — Grocery List{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <h2 class="form-title">Add Item</h2>
        <form method="post" action="{{ url_for('add') }}" class="item-form">

            <div class="form-group">
                <label for="name">Item Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" required autofocus
                       placeholder="e.g. Whole Milk" class="form-input">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" value="1"
                           min="0.01" step="0.01" class="form-input">
                </div>
                <div class="form-group">
                    <label for="unit">Unit</label>
                    <select id="unit" name="unit" class="form-input">
                        {% for u in units %}
                        <option value="{{ u }}">{{ u if u else '— none —' }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" class="form-input">
                    {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <input type="text" id="notes" name="notes"
                       placeholder="e.g. organic, brand preference…" class="form-input">
            </div>

            <div class="form-actions">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Add Item</button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
