{% extends "base.html" %}
{% block content %}

<section class="form-section">
    <h2>Add New Entry</h2>
    <form method="POST" class="entry-form">
        <div class="form-group">
            <label for="title">Title <span class="required">*</span></label>
            <input type="text" id="title" name="title" required placeholder="Enter title...">
        </div>
        <div class="form-group">
            <label for="category">Category <span class="required">*</span></label>
            <select id="category" name="category" required>
                <option value="" disabled selected>Select a category</option>
                {% for cat in categories %}
                <option value="{{ cat }}" style="background-color: {{ category_colors[cat] }}; color: white;">
                    {{ cat }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="5" placeholder="Optional notes..."></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-save">Save Entry</button>
            <a href="{{ url_for('index') }}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</section>

{% endblock %}
