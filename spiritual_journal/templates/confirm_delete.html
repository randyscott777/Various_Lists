{% extends "base.html" %}
{% block content %}

<section class="confirm-section">
    <h2>Confirm Delete</h2>
    <div class="confirm-card">
        <p>Are you sure you want to delete this entry?</p>
        <div class="confirm-detail">
            <strong>Title:</strong> {{ row["title"] }}<br>
            <strong>Category:</strong>
            <span class="badge" style="background-color: {{ category_colors[row['category']] if row['category'] in category_colors else '#888' }}; color: white;">
                {{ row["category"] }}
            </span>
        </div>
        <form method="POST" class="confirm-form">
            <button type="submit" class="btn-delete-confirm">Yes, Delete</button>
            <a href="{{ url_for('index') }}" class="btn-cancel">Cancel</a>
        </form>
    </div>
</section>

{% endblock %}
