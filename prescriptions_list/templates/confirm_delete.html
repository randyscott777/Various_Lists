{% extends "base.html" %}
{% block title %}Confirm Delete{% endblock %}
{% block content %}
<div class="form-container confirm-delete">
    <h2>Confirm Delete</h2>
    <p>Are you sure you want to delete <strong>{{ item['medication_name'] }}</strong> ({{ item['dosage'] }})?</p>
    <p class="warning">This action cannot be undone.</p>
    <form method="POST" action="{{ url_for('delete', id=item['id']) }}">
        <div class="form-actions">
            <button type="submit" class="btn-delete">Yes, Delete</button>
            <a href="{{ url_for('index') }}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
