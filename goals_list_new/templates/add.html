{% extends "base.html" %}
{% block content %}

<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <h2>&#x2795; New Goal</h2>
    </div>
    <div class="form-card-body">

      {% if error %}
      <div class="form-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('add') }}">

        <div class="form-group">
          <label for="title">Title <span class="req">*</span></label>
          <input type="text" id="title" name="title" placeholder="What do you want to achieve?"
                 required value="{{ request.form.get('title', '') }}">
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" name="description"
                 placeholder="Optional details or notes"
                 value="{{ request.form.get('description', '') }}">
        </div>

        <div class="form-row-3">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              {% for c in categories %}
              <option value="{{ c }}" {% if request.form.get('category', 'Personal') == c %}selected{% endif %}>{{ c }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              {% for p in priorities %}
              <option value="{{ p }}" {% if request.form.get('priority', 'Medium') == p %}selected{% endif %}>{{ p }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
              {% for s in statuses %}
              <option value="{{ s }}" {% if request.form.get('status', 'Not Started') == s %}selected{% endif %}>{{ s }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="due_date">Due Date</label>
          <input type="date" id="due_date" name="due_date"
                 value="{{ request.form.get('due_date', '') }}">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-save">&#x2713; Save Goal</button>
          <a href="{{ url_for('index') }}" class="btn-cancel">Cancel</a>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}
