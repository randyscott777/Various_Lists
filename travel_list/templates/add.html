{% extends "base.html" %}
{% block title %}Add Travel Plan{% endblock %}

{% block content %}
<div class="form-card">
    <h2>&#10133; Add New Trip</h2>
    <form method="post" action="{{ url_for('add') }}">
        <div class="form-row">
            <div class="form-group full">
                <label for="destination">Destination *</label>
                <input type="text" id="destination" name="destination" required placeholder="e.g. Paris, France">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="start_date">Start Date</label>
                <input type="date" id="start_date" name="start_date">
            </div>
            <div class="form-group">
                <label for="end_date">End Date</label>
                <input type="date" id="end_date" name="end_date">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="travelers">Number of Travelers</label>
                <input type="number" id="travelers" name="travelers" value="1" min="1">
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    {% for s in status_options %}
                    <option value="{{ s }}" {% if s == 'Planned' %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group full">
                <label for="budget">Estimated Budget ($)</label>
                <input type="number" id="budget" name="budget" value="0.00" min="0" step="0.01">
            </div>
        </div>
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" placeholder="Accommodation, activities, reminders..."></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-success">Save Trip</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
