<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Project Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
        .badge-priority-High { background-color: #dc3545; }
        .badge-priority-Medium { background-color: #fd7e14; }
        .badge-priority-Low { background-color: #198754; }
        .badge-status-Done { background-color: #198754; }
        .badge-status-In-Progress { background-color: #0d6efd; }
        .badge-status-To-Do { background-color: #6c757d; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('projects') }}">Project Manager</a>
        </div>
    </nav>
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
