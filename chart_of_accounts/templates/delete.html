<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Delete Account</h1>
        <a href="{{ url_for('index') }}" class="btn btn-back">Back</a>
    </div>

    <div class="confirm-box">
        <p class="confirm-warning">Are you sure you want to delete this account?</p>
        <div class="confirm-details">
            <p><strong>Account #:</strong> {{ account.account_number }}</p>
            <p><strong>Name:</strong> {{ account.account_name }}</p>
            <p><strong>Type:</strong> {{ account.account_type }}</p>
            <p><strong>Subtype:</strong> {{ account.account_subtype }}</p>
            <p><strong>Active:</strong> {{ account.is_active }}</p>
        </div>
        <form method="POST" action="{{ url_for('delete', id=account.id) }}" class="confirm-form">
            <button type="submit" class="btn btn-delete">Yes, Delete</button>
            <a href="{{ url_for('index') }}" class="btn btn-back">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
