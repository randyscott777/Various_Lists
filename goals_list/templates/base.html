<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Goals & Plans{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="{{ url_for('index') }}" class="logo">Goals &amp; Plans</a>
            <nav>
                <a href="{{ url_for('index') }}">Dashboard</a>
                <a href="{{ url_for('add') }}" class="btn-nav">+ New Goal</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Goals &amp; Plans &copy; 2026</p>
    </footer>
</body>
</html>
