{% extends "base.html" %}
{% block title %}Add Goal — Goals & Plans{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-header">
        <h1>New Goal</h1>
        <a href="{{ url_for('index') }}" class="btn btn-back">Back</a>
    </div>

    <form method="post" class="goal-form">
        <div class="form-group">
            <label for="title">Title <span class="required">*</span></label>
            <input type="text" id="title" name="title" required autofocus placeholder="Enter goal title">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" placeholder="Describe your goal..."></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category">
                    {% for c in categories %}
                    <option value="{{ c }}">{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                    {% for p in priorities %}
                    <option value="{{ p }}" {% if p == 'Medium' %}selected{% endif %}>{{ p }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    {% for s in statuses %}
                    <option value="{{ s }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group form-group-half">
            <label for="target_date">Target Date</label>
            <input type="date" id="target_date" name="target_date">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Goal</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
