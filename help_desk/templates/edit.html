{% extends "base.html" %}
{% block title %}Edit Ticket #{{ ticket.id }} — Help Desk{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Edit Ticket #{{ ticket.id }}</h1>
  <a href="{{ url_for('view_ticket', id=ticket.id) }}" class="btn btn-ghost">&larr; Back</a>
</div>

<div class="form-card">
  <form method="POST" action="{{ url_for('edit_ticket', id=ticket.id) }}">
    <div class="form-group">
      <label for="title">Title <span class="required">*</span></label>
      <input type="text" id="title" name="title" required value="{{ ticket.title }}">
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="5">{{ ticket.description }}</textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category">
          {% for c in categories %}
            <option value="{{ c }}" {% if c == ticket.category %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
          {% for p in priorities %}
            <option value="{{ p }}" {% if p == ticket.priority %}selected{% endif %}>{{ p }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="status">
          {% for s in statuses %}
            <option value="{{ s }}" {% if s == ticket.status %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="assigned_to">Assigned To</label>
      <input type="text" id="assigned_to" name="assigned_to" value="{{ ticket.assigned_to }}">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('view_ticket', id=ticket.id) }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
