{% extends "base.html" %}
{% block title %}New Ticket — Help Desk{% endblock %}

{% block content %}
<div class="page-header">
  <h1>New Ticket</h1>
  <a href="{{ url_for('index') }}" class="btn btn-ghost">&larr; Back</a>
</div>

<div class="form-card">
  <form method="POST" action="{{ url_for('new_ticket') }}">
    <div class="form-group">
      <label for="title">Title <span class="required">*</span></label>
      <input type="text" id="title" name="title" required placeholder="Brief summary of the issue">
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="5" placeholder="Detailed description of the issue..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category">
          {% for c in categories %}
            <option value="{{ c }}">{{ c }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
          {% for p in priorities %}
            <option value="{{ p }}">{{ p }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="assigned_to">Assigned To</label>
      <input type="text" id="assigned_to" name="assigned_to" placeholder="Technician name (optional)">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create Ticket</button>
      <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
