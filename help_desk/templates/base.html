<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Help Desk{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <span class="header-icon">&#128203;</span>
      <span class="header-title">Help Desk</span>
    </div>
    <nav class="header-nav">
      <a href="{{ url_for('index') }}" class="nav-link">Dashboard</a>
      <a href="{{ url_for('new_ticket') }}" class="nav-link nav-link-cta">+ New Ticket</a>
    </nav>
  </header>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>Help Desk &copy; 2026</span>
  </footer>
</body>
</html>
