{% extends "base.html" %}
{% block content %}

<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <h2>&#x270F;&#xFE0F; Edit Account &mdash; {{ account.account_number }}</h2>
    </div>
    <div class="form-card-body">

      {% if error %}
      <div class="form-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('edit', id=account.id) }}">

        <div class="form-row-2">
          <div class="form-group">
            <label for="account_number">Account Number</label>
            <input type="text" id="account_number" name="account_number"
                   maxlength="3" required value="{{ account.account_number }}">
          </div>
          <div class="form-group">
            <label for="is_active">Status</label>
            <select id="is_active" name="is_active">
              <option value="Yes" {% if account.is_active == 'Yes' %}selected{% endif %}>Active</option>
              <option value="No"  {% if account.is_active == 'No'  %}selected{% endif %}>Inactive</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="account_name">Account Name</label>
          <input type="text" id="account_name" name="account_name"
                 required value="{{ account.account_name }}">
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="account_type">Account Type</label>
            <select id="account_type" name="account_type">
              {% for t in account_types %}
              <option value="{{ t }}" {% if account.account_type == t %}selected{% endif %}>{{ t }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label for="account_subtype">Subtype</label>
            <select id="account_subtype" name="account_subtype">
              {% for type_name, subtypes in account_subtypes.items() %}
              <optgroup label="{{ type_name }}">
                {% for s in subtypes %}
                <option value="{{ s }}" {% if account.account_subtype == s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
              </optgroup>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-save">&#x2713; Update Account</button>
          <a href="{{ url_for('index') }}" class="btn-cancel">Cancel</a>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}
