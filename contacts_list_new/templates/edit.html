{% extends "base.html" %}
{% block title %}Edit {{ contact.first_name }} {{ contact.last_name }}{% endblock %}
{% block content %}

<div class="form-card">
  <h2 class="form-title">&#9998; Edit Contact</h2>
  <form method="POST" action="{{ url_for('edit', cid=contact.id) }}">
    <div class="form-row">
      <div class="form-group">
        <label>First Name <span class="req">*</span></label>
        <input type="text" name="first_name" value="{{ contact.first_name }}" required class="form-input">
      </div>
      <div class="form-group">
        <label>Last Name <span class="req">*</span></label>
        <input type="text" name="last_name" value="{{ contact.last_name }}" required class="form-input">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ contact.email }}" class="form-input">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" value="{{ contact.phone }}" class="form-input">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Company</label>
        <input type="text" name="company" value="{{ contact.company }}" class="form-input">
      </div>
      <div class="form-group">
        <label>Contact Type</label>
        <select name="contact_type" class="form-input form-select">
          {% for ct in contact_types %}
          <option value="{{ ct }}" {% if contact.contact_type == ct %}selected{% endif %}>{{ ct }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Address</label>
      <input type="text" name="address" value="{{ contact.address }}" class="form-input">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>City</label>
        <input type="text" name="city" value="{{ contact.city }}" class="form-input">
      </div>
      <div class="form-group">
        <label>State</label>
        <input type="text" name="state" value="{{ contact.state }}" class="form-input">
      </div>
      <div class="form-group form-group-sm">
        <label>ZIP</label>
        <input type="text" name="zip" value="{{ contact.zip }}" class="form-input">
      </div>
    </div>

    <div class="form-group">
      <label>Notes</label>
      <textarea name="notes" class="form-input form-textarea" rows="3">{{ contact.notes }}</textarea>
    </div>

    <div class="form-row form-checks">
      <label class="check-label">
        <input type="checkbox" name="favorite" value="1" {% if contact.favorite %}checked{% endif %}> &#9733; Favorite
      </label>
      <label class="check-label">
        <input type="checkbox" name="active" value="1" {% if contact.active %}checked{% endif %}> Active
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-new">Save Changes</button>
      <a href="{{ url_for('view', cid=contact.id) }}" class="btn btn-clear">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
