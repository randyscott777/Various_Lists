{% extends "base.html" %}
{% block title %}Edit Ingredient — {{ meal['name'] }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Ingredient</h1>
    <a class="btn btn-ghost" href="{{ url_for('meal_view', meal_id=meal['id']) }}">← Back to {{ meal['name'] }}</a>
</div>

<div class="form-card">
    <form method="post" action="{{ url_for('ingredient_edit', ing_id=ing['id']) }}">
        <div class="form-group">
            <label for="name">Ingredient Name <span class="required">*</span></label>
            <input id="name" type="text" name="name" required value="{{ ing['name'] }}">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input id="quantity" type="text" name="quantity" value="{{ ing['quantity'] or '' }}">
            </div>
            <div class="form-group">
                <label for="unit">Unit</label>
                <input id="unit" type="text" name="unit" value="{{ ing['unit'] or '' }}">
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Save Changes</button>
            <a class="btn btn-ghost" href="{{ url_for('meal_view', meal_id=meal['id']) }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
