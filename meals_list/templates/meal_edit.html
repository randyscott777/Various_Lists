{% extends "base.html" %}
{% block title %}Edit {{ meal['name'] }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Meal</h1>
    <a class="btn btn-ghost" href="{{ url_for('meal_view', meal_id=meal['id']) }}">← Back</a>
</div>

<div class="form-card">
    <form method="post" action="{{ url_for('meal_edit', meal_id=meal['id']) }}">
        <div class="form-group">
            <label for="name">Meal Name <span class="required">*</span></label>
            <input id="name" type="text" name="name" required value="{{ meal['name'] }}">
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{ meal['description'] or '' }}</textarea>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Save Changes</button>
            <a class="btn btn-ghost" href="{{ url_for('meal_view', meal_id=meal['id']) }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
