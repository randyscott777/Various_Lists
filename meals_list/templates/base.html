<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meals{% endblock %} — Meal Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a class="brand" href="{{ url_for('index') }}">🍽 Meal Planner</a>
            <a class="nav-btn" href="{{ url_for('meal_add') }}">+ Add Meal</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Meal Planner &copy; 2026</p>
    </footer>
</body>
</html>
