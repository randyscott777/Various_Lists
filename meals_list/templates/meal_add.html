{% extends "base.html" %}
{% block title %}Add Meal{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add Meal</h1>
    <a class="btn btn-ghost" href="{{ url_for('index') }}">← Back</a>
</div>

<div class="form-card">
    <form method="post" action="{{ url_for('meal_add') }}">
        <div class="form-group">
            <label for="name">Meal Name <span class="required">*</span></label>
            <input id="name" type="text" name="name" required autofocus placeholder="e.g. Spaghetti Bolognese">
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" placeholder="Optional notes about this meal…"></textarea>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Save Meal</button>
            <a class="btn btn-ghost" href="{{ url_for('index') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
