{% extends "base.html" %}
{% block title %}Add Ingredient — {{ meal['name'] }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add Ingredient</h1>
    <a class="btn btn-ghost" href="{{ url_for('meal_view', meal_id=meal['id']) }}">← Back to {{ meal['name'] }}</a>
</div>

<div class="form-card">
    <form method="post" action="{{ url_for('ingredient_add', meal_id=meal['id']) }}">
        <div class="form-group">
            <label for="name">Ingredient Name <span class="required">*</span></label>
            <input id="name" type="text" name="name" required autofocus placeholder="e.g. Garlic">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input id="quantity" type="text" name="quantity" placeholder="e.g. 2">
            </div>
            <div class="form-group">
                <label for="unit">Unit</label>
                <input id="unit" type="text" name="unit" placeholder="e.g. cloves, cups, g">
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Add Ingredient</button>
            <a class="btn btn-ghost" href="{{ url_for('meal_view', meal_id=meal['id']) }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
