<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Family Tree{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .tree ul {
            list-style: none;
            padding-left: 1.5rem;
            border-left: 2px solid #dee2e6;
            margin-top: 0.25rem;
        }
        .tree > ul {
            padding-left: 0;
            border-left: none;
        }
        .tree li {
            padding: 0.2rem 0;
        }
        .spouse-link {
            color: #6c757d;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">Family Tree</a>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('person_add') }}">+ Add Person</a>
    </div>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
