<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item - Budget App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Add Budget Item</h1>
        <a href="{{ url_for('index') }}" class="btn btn-ghost">&larr; Back</a>
    </header>

    <main>
        <section class="form-section">
            <form method="POST" action="{{ url_for('add') }}" class="item-form">
                <div class="form-group">
                    <label for="name">Name <span class="required">*</span></label>
                    <input type="text" name="name" id="name" required placeholder="e.g. Grocery run">
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($) <span class="required">*</span></label>
                    <input type="number" name="amount" id="amount" required min="0.01" step="0.01" placeholder="0.00">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category <span class="required">*</span></label>
                        <select name="category" id="category" required>
                            <option value="">Select category</option>
                            {% for cat in categories %}
                            <option value="{{ cat }}">{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="type">Type <span class="required">*</span></label>
                        <select name="type" id="type" required>
                            <option value="">Select type</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="date">Date <span class="required">*</span></label>
                    <input type="date" name="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea name="notes" id="notes" rows="3" placeholder="Optional notes"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Item</button>
                    <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
