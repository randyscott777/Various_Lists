<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item - Budget App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Edit Budget Item</h1>
        <a href="{{ url_for('index') }}" class="btn btn-ghost">&larr; Back</a>
    </header>

    <main>
        <section class="form-section">
            <form method="POST" action="{{ url_for('edit', id=item.id) }}" class="item-form">
                <div class="form-group">
                    <label for="name">Name <span class="required">*</span></label>
                    <input type="text" name="name" id="name" required value="{{ item.name }}">
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($) <span class="required">*</span></label>
                    <input type="number" name="amount" id="amount" required min="0.01" step="0.01" value="{{ item.amount }}">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category <span class="required">*</span></label>
                        <select name="category" id="category" required>
                            {% for cat in categories %}
                            <option value="{{ cat }}" {{ 'selected' if item.category == cat }}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="type">Type <span class="required">*</span></label>
                        <select name="type" id="type" required>
                            <option value="income" {{ 'selected' if item.type == 'income' }}>Income</option>
                            <option value="expense" {{ 'selected' if item.type == 'expense' }}>Expense</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="date">Date <span class="required">*</span></label>
                    <input type="date" name="date" id="date" required value="{{ item.date }}">
                </div>
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea name="notes" id="notes" rows="3">{{ item.notes or '' }}</textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
