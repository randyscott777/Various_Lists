<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete - Budget App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Confirm Delete</h1>
        <a href="{{ url_for('index') }}" class="btn btn-ghost">&larr; Back</a>
    </header>

    <main>
        <section class="confirm-section">
            <div class="confirm-box">
                <p class="confirm-msg">Are you sure you want to delete this item?</p>
                <table class="confirm-table">
                    <tr><th>Name</th><td>{{ item.name }}</td></tr>
                    <tr><th>Amount</th><td>${{ "%.2f"|format(item.amount) }}</td></tr>
                    <tr><th>Category</th><td>{{ item.category }}</td></tr>
                    <tr><th>Type</th><td>{{ item.type }}</td></tr>
                    <tr><th>Date</th><td>{{ item.date }}</td></tr>
                    {% if item.notes %}
                    <tr><th>Notes</th><td>{{ item.notes }}</td></tr>
                    {% endif %}
                </table>
                <form method="POST" action="{{ url_for('delete', id=item.id) }}" class="confirm-actions">
                    <button type="submit" class="btn btn-delete">Yes, Delete</button>
                    <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancel</a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
