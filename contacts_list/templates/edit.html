{% extends 'base.html' %}
{% block title %}Edit {{ contact.first_name }} {{ contact.last_name }}{% endblock %}
{% block content %}

<div class="form-page">
    <h2>Edit Contact</h2>
    <form method="POST" action="{{ url_for('edit', contact_id=contact.id) }}" class="contact-form">
        <div class="form-row">
            <div class="form-group">
                <label for="first_name">First Name <span class="required">*</span></label>
                <input type="text" id="first_name" name="first_name" value="{{ contact.first_name }}" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name <span class="required">*</span></label>
                <input type="text" id="last_name" name="last_name" value="{{ contact.last_name }}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ contact.email or '' }}">
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" value="{{ contact.phone or '' }}">
            </div>
        </div>

        <div class="form-group">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" value="{{ contact.company or '' }}">
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" value="{{ contact.address or '' }}">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" value="{{ contact.city or '' }}">
            </div>
            <div class="form-group form-group-sm">
                <label for="state">State</label>
                <input type="text" id="state" name="state" value="{{ contact.state or '' }}" maxlength="2">
            </div>
            <div class="form-group form-group-sm">
                <label for="zip">Zip</label>
                <input type="text" id="zip" name="zip" value="{{ contact.zip or '' }}" maxlength="10">
            </div>
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="3">{{ contact.notes or '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Save Changes</button>
            <a href="{{ url_for('view', contact_id=contact.id) }}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
