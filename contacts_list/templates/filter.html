{% extends 'base.html' %}
{% block title %}Filter Contacts{% endblock %}
{% block content %}

<div class="form-page">
    <h2>Filter Contacts</h2>
    <form method="GET" action="{{ url_for('index') }}" class="contact-form">
        <div class="form-row">
            <div class="form-group">
                <label for="filter_field">Filter field</label>
                <select name="filter_field" id="filter_field">
                    <option value="" {% if not filter_field %}selected{% endif %}>Any field</option>
                    {% for field in filterable_fields %}
                    <option value="{{ field }}" {% if filter_field == field %}selected{% endif %}>
                        {{ field.replace('_', ' ').title() }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="filter_text">Value to match</label>
                <input type="text" id="filter_text" name="filter_text" autofocus
                       value="{{ filter_text }}"
                       placeholder="e.g. Smith, Acme, Chicago...">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="sort_field">Sort by</label>
                <select name="sort_field" id="sort_field">
                    {% for field in sortable_fields %}
                    <option value="{{ field }}" {% if sort_field == field %}selected{% endif %}>
                        {{ field.replace('_', ' ').title() }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="sort_dir">Direction</label>
                <select name="sort_dir" id="sort_dir">
                    <option value="asc" {% if sort_dir == 'asc' %}selected{% endif %}>A &rarr; Z</option>
                    <option value="desc" {% if sort_dir == 'desc' %}selected{% endif %}>Z &rarr; A</option>
                </select>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Apply Filter</button>
            <a href="{{ url_for('index') }}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
