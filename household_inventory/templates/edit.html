{% extends "base.html" %}
{% block title %}Edit Item — Inventory{% endblock %}
{% block content %}

<div class="form-container">
    <h2>Edit Item</h2>
    <form method="post" action="{{ url_for('edit', item_id=item.id) }}" class="item-form">

        <div class="form-group">
            <label for="name">Item Name <span class="required">*</span></label>
            <input type="text" id="name" name="name" required value="{{ item.name }}">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" value="{{ item.category or '' }}">
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" value="{{ item.location or '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" min="1" value="{{ item.quantity }}">
            </div>
            <div class="form-group">
                <label for="condition">Condition</label>
                <select id="condition" name="condition">
                    <option value="">-- Select --</option>
                    {% for cond in ['New', 'Good', 'Fair', 'Poor'] %}
                    <option value="{{ cond }}" {% if item.condition == cond %}selected{% endif %}>{{ cond }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="purchase_date">Purchase Date</label>
                <input type="date" id="purchase_date" name="purchase_date" value="{{ item.purchase_date or '' }}">
            </div>
            <div class="form-group">
                <label for="purchase_price">Purchase Price ($)</label>
                <input type="number" id="purchase_price" name="purchase_price" min="0" step="0.01"
                    value="{{ '%.2f' % item.purchase_price if item.purchase_price is not none else '' }}">
            </div>
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="3">{{ item.notes or '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Item</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
